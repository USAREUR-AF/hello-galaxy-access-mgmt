<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,Segoe UI,Roboto,Arial">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5ec8cd"/>
    </marker>
  </defs>
  <style>
    .lbl{fill:#9aa7b4;font-size:13px} .ttl{fill:#e6edf3;font-size:16px;font-weight:700}
    .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
    .anchor{fill:#f5b14c;font-size:13px} .grant{fill:#7ee2a8;font-size:12px}
    .free{fill:#e7c07b;font-size:12px}
  </style>

  <!-- leaf certs (left) -->
  <text x="20" y="28" class="lbl">leaf certificates (CN = anchor)</text>
  <g>
    <rect x="20" y="44" width="190" height="46" rx="8" fill="#1c232c" stroke="#2a323c"/>
    <text x="34" y="64" class="lbl">weather-vane</text>
    <text x="34" y="82" class="mono anchor">a11ce551…</text>
    <rect x="20" y="104" width="190" height="46" rx="8" fill="#1c232c" stroke="#2a323c"/>
    <text x="34" y="124" class="lbl">steady-eddie</text>
    <text x="34" y="142" class="mono anchor">5addecaf…</text>
    <rect x="20" y="164" width="190" height="46" rx="8" fill="#1c232c" stroke="#2a323c"/>
    <text x="34" y="184" class="lbl">loud-mouth</text>
    <text x="34" y="202" class="mono anchor">f100ded0…</text>
    <rect x="20" y="224" width="190" height="46" rx="8" fill="#161b22" stroke="#3a2f17" stroke-dasharray="5 4"/>
    <text x="34" y="244" class="free">(no leaf minted)</text>
    <text x="34" y="262" class="mono free">— onboard to claim —</text>
  </g>

  <!-- router ACL (right) -->
  <rect x="430" y="36" width="450" height="288" rx="14" fill="#12171e" stroke="#2a323c"/>
  <text x="452" y="64" class="ttl">Zenoh router — static ACL (pre-cut)</text>
  <text x="452" y="84" class="lbl">default-deny · grant keyed on cert CN == slot anchor</text>

  <g>
    <rect x="452" y="100" width="406" height="44" rx="8" fill="#10261a" stroke="#1f6f3f"/>
    <text x="466" y="118" class="mono anchor">slot a11ce551…</text>
    <text x="466" y="135" class="mono grant">allow put a11ce551…/**   → weather-vane</text>
    <rect x="452" y="150" width="406" height="44" rx="8" fill="#10261a" stroke="#1f6f3f"/>
    <text x="466" y="168" class="mono anchor">slot 5addecaf…</text>
    <text x="466" y="185" class="mono grant">allow put 5addecaf…/**   → steady-eddie</text>
    <rect x="452" y="200" width="406" height="44" rx="8" fill="#10261a" stroke="#1f6f3f"/>
    <text x="466" y="218" class="mono anchor">slot f100ded0…</text>
    <text x="466" y="235" class="mono grant">allow put f100ded0…/**   → loud-mouth</text>
    <rect x="452" y="250" width="406" height="44" rx="8" fill="#1a1710" stroke="#6f561f" stroke-dasharray="5 4"/>
    <text x="466" y="268" class="mono anchor">slot face5107…</text>
    <text x="466" y="285" class="mono free">allow put face5107…/**   → FREE (pre-cut, unheld)</text>
  </g>

  <!-- arrows leaf->slot -->
  <line x1="210" y1="67"  x2="452" y2="122" stroke="#5ec8cd" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="210" y1="127" x2="452" y2="172" stroke="#5ec8cd" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="210" y1="187" x2="452" y2="222" stroke="#5ec8cd" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="250" y="318" class="lbl">a leaf is admitted iff its CN matches a granted slot — authority lives on the slot, not the leaf</text>
</svg>
